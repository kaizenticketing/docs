name = "docs"
compatibility_date = "2026-02-09"
# a pull request's preview is served on workers.dev - `wrangler deploy` applies this, so it takes effect from main
preview_urls = true

[assets]
directory = "./dist"

# a pull request's build deploys with `wrangler preview`, which needs this block - it can be empty, as the
# .. assets and compatibility settings above apply to a preview too
[previews]

[[routes]]
pattern = "docs.ktckts.com"
custom_domain = true